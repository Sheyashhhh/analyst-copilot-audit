# Trap: fact_orders.order_status carries mixed casing and stray whitespace.
# Each trap query is correct in every respect except it compares the raw status string.
- id: ST01
  family: status_case
  difficulty: easy
  grain: order
  question: "How many orders were delivered?"
  gold_sql: |
    SELECT count(*) AS orders
    FROM fact_orders
    WHERE NOT is_deleted AND lower(trim(order_status)) = 'delivered'
  naive_sql: |
    SELECT count(*) AS orders
    FROM fact_orders
    WHERE NOT is_deleted AND order_status = 'delivered'
  expected_failure: STATUS_CASE_MISMATCH

- id: ST02
  family: status_case
  difficulty: easy
