- id: ST03
  family: status_case
  difficulty: easy
  grain: order
  question: "How many orders are there in each order status?"
  gold_sql: |
    SELECT lower(trim(order_status)) AS order_status, count(*) AS orders
    FROM fact_orders
    WHERE NOT is_deleted
    GROUP BY 1
  naive_sql: |
    SELECT order_status, count(*) AS orders
    FROM fact_orders
    WHERE NOT is_deleted
    GROUP BY 1
  expected_failure: STATUS_CASE_MISMATCH

- id: ST04
  family: status_case
  difficulty: medium
  grain: order
  question: "What percentage of orders were delivered? Round to 2 decimals."
  gold_sql: |
    SELECT round(100.0 * count(*) FILTER (WHERE lower(trim(order_status)) = 'delivered') / count(*), 2) AS delivered_pct
    FROM fact_orders
    WHERE NOT is_deleted
  naive_sql: |
    SELECT round(100.0 * count(*) FILTER (WHERE order_status = 'delivered') / count(*), 2) AS delivered_pct
    FROM fact_orders
    WHERE NOT is_deleted
  expected_failure: STATUS_CASE_MISMATCH

