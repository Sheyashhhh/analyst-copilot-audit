- id: ST07
  family: status_case
  difficulty: medium
  question: "What is the average number of days between purchase and delivery to the customer for delivered orders? Use fractional days and round to 2 decimals."
  gold_sql: |
    SELECT round(avg(date_diff('second', order_purchase_ts, order_delivered_customer_ts) / 86400.0), 2) AS avg_days
    FROM fact_orders
    WHERE NOT is_deleted AND lower(trim(order_status)) = 'delivered'
  naive_sql: |
    SELECT round(avg(date_diff('second', order_purchase_ts, order_delivered_customer_ts) / 86400.0), 2) AS avg_days
    FROM fact_orders
    WHERE NOT is_deleted AND order_status = 'delivered'
  expected_failure: STATUS_CASE_MISMATCH

- id: ST08
  family: status_case
  difficulty: medium
  grain: order
  ordered: true
  question: "Which 5 customer states have the most delivered orders? Return the state and order count, highest first, breaking ties alphabetically."
  gold_sql: |
    SELECT c.state, count(*) AS orders
    FROM fact_orders o
    JOIN dim_customer c ON c.customer_key = o.customer_key
    WHERE NOT o.is_deleted AND lower(trim(o.order_status)) = 'delivered'
    GROUP BY c.state
    ORDER BY orders DESC, c.state
    LIMIT 5
  naive_sql: |
    SELECT c.state, count(*) AS orders
    FROM fact_orders o
    JOIN dim_customer c ON c.customer_key = o.customer_key
    WHERE NOT o.is_deleted AND o.order_status = 'delivered'
    GROUP BY c.state
    ORDER BY orders DESC, c.state
    LIMIT 5
  expected_failure: STATUS_CASE_MISMATCH
