# Trap: fact_orders.is_deleted and dim_customer.is_deleted. Each trap query is identical to
# the gold query except that it omits the soft-delete predicate.
- id: SD01
  family: soft_delete
  difficulty: easy
  grain: order
  question: "How many orders have been placed in total?"
  gold_sql: |
    SELECT count(*) AS orders FROM fact_orders WHERE NOT is_deleted
  naive_sql: |
    SELECT count(*) AS orders FROM fact_orders
  expected_failure: SOFT_DELETE_IGNORED

- id: SD02
  family: soft_delete
  difficulty: easy
  grain: order
  question: "How many orders were placed in 2017?"
  gold_sql: |
    SELECT count(*) AS orders
    FROM fact_orders
    WHERE NOT is_deleted
      AND order_purchase_ts >= TIMESTAMP '2017-01-01' AND order_purchase_ts < TIMESTAMP '2018-01-01'
  naive_sql: |
    SELECT count(*) AS orders
    FROM fact_orders
    WHERE order_purchase_ts >= TIMESTAMP '2017-01-01' AND order_purchase_ts < TIMESTAMP '2018-01-01'
  expected_failure: SOFT_DELETE_IGNORED

- id: SD03
  family: soft_delete
  difficulty: medium
  grain: order
  question: "How many orders were placed by customers located in the state of SP?"
  gold_sql: |
    SELECT count(*) AS orders
    FROM fact_orders o
    JOIN dim_customer c ON c.customer_key = o.customer_key
    WHERE NOT o.is_deleted AND c.state = 'SP'
  naive_sql: |
    SELECT count(*) AS orders
    FROM fact_orders o
    JOIN dim_customer c ON c.customer_key = o.customer_key
    WHERE c.state = 'SP'
  expected_failure: SOFT_DELETE_IGNORED

- id: SD04
  family: soft_delete
  difficulty: easy
  question: "What is the average review score across all reviews, rounded to 4 decimals?"
  gold_sql: |
    SELECT round(avg(r.review_score), 4) AS avg_score
    FROM fact_reviews r
    JOIN fact_orders o ON o.order_id = r.order_id
    WHERE NOT o.is_deleted
  naive_sql: |
    SELECT round(avg(review_score), 4) AS avg_score FROM fact_reviews
  expected_failure: SOFT_DELETE_IGNORED

