- id: SD06
  family: soft_delete
  difficulty: easy
  grain: order
  ordered: true
  question: "How many orders were placed in each month of 2018? Return the month number and the order count, ordered by month."
  gold_sql: |
    SELECT month(order_purchase_ts) AS month, count(*) AS orders
    FROM fact_orders
    WHERE NOT is_deleted
      AND order_purchase_ts >= TIMESTAMP '2018-01-01' AND order_purchase_ts < TIMESTAMP '2019-01-01'
    GROUP BY 1
    ORDER BY 1
  naive_sql: |
    SELECT month(order_purchase_ts) AS month, count(*) AS orders
    FROM fact_orders
    WHERE order_purchase_ts >= TIMESTAMP '2018-01-01' AND order_purchase_ts < TIMESTAMP '2019-01-01'
    GROUP BY 1
    ORDER BY 1
  expected_failure: SOFT_DELETE_IGNORED

- id: SD07
  family: soft_delete
  difficulty: medium
  question: "What is the total payment value for each payment type?"
  gold_sql: |
    SELECT p.payment_type, sum(p.payment_value) AS total_payment_value
    FROM fact_payments p
    JOIN fact_orders o ON o.order_id = p.order_id
    WHERE NOT o.is_deleted
    GROUP BY 1
  naive_sql: |
    SELECT payment_type, sum(payment_value) AS total_payment_value
    FROM fact_payments
    GROUP BY 1
  expected_failure: SOFT_DELETE_IGNORED

- id: SD08
  family: soft_delete
  difficulty: easy
  grain: order
  question: "How many orders have no items attached to them?"
  gold_sql: |
    SELECT count(*) AS orders FROM fact_orders WHERE NOT is_deleted AND item_count = 0
  naive_sql: |
    SELECT count(*) AS orders FROM fact_orders WHERE item_count = 0
  expected_failure: SOFT_DELETE_IGNORED

- id: SD09
  family: soft_delete
  difficulty: medium
  ordered: true
  question: "Which 5 states have the most customers? Count each person once. Return the state and customer count, highest first, breaking ties alphabetically."
  gold_sql: |
    SELECT state, count(DISTINCT customer_unique_id) AS customers
    FROM dim_customer
    WHERE NOT is_deleted
    GROUP BY state
    ORDER BY customers DESC, state
    LIMIT 5
  naive_sql: |
    SELECT state, count(DISTINCT customer_unique_id) AS customers
    FROM dim_customer
    GROUP BY state
    ORDER BY customers DESC, state
    LIMIT 5
  expected_failure: SOFT_DELETE_IGNORED

- id: SD10
  family: soft_delete
  difficulty: medium
  question: "How many sellers have sold at least one item?"
  gold_sql: |
    SELECT count(DISTINCT i.seller_key) AS sellers
    FROM fact_order_items i
    JOIN fact_orders o ON o.order_id = i.order_id
    WHERE NOT o.is_deleted
  naive_sql: |
    SELECT count(DISTINCT seller_key) AS sellers FROM fact_order_items
  expected_failure: SOFT_DELETE_IGNORED
