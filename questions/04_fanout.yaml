- id: FO14
  family: fanout
  difficulty: hard
  question: "What is the average review score of orders that were paid with more than one payment? Round to 4 decimals."
  gold_sql: |
    SELECT round(avg(r.review_score), 4) AS avg_score
    FROM fact_reviews r
    JOIN fact_orders o ON o.order_id = r.order_id
    WHERE NOT o.is_deleted
      AND r.order_id IN (SELECT order_id FROM fact_payments GROUP BY order_id HAVING count(*) > 1)
  naive_sql: |
    SELECT round(avg(r.review_score), 4) AS avg_score
    FROM fact_reviews r
    JOIN fact_orders o ON o.order_id = r.order_id
    JOIN fact_payments p ON p.order_id = o.order_id
    WHERE NOT o.is_deleted AND p.payment_sequential >= 2
  expected_failure: FANOUT_INFLATION
