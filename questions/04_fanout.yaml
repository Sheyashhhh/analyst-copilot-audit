- id: FO11
  family: fanout
  difficulty: hard
  grain: order
  ordered: true
  question: "For each month from January to August 2018, how many orders were placed and how many items did those orders contain? Return the month number, order count and item count, ordered by month."
  gold_sql: |
    SELECT month(order_purchase_ts) AS month, count(*) AS orders, sum(item_count) AS items
    FROM fact_orders
    WHERE NOT is_deleted
      AND order_purchase_ts >= TIMESTAMP '2018-01-01' AND order_purchase_ts < TIMESTAMP '2018-09-01'
    GROUP BY 1
    ORDER BY 1
  naive_sql: |
    SELECT month(o.order_purchase_ts) AS month, count(o.order_id) AS orders, count(i.order_item_id) AS items
    FROM fact_orders o
    LEFT JOIN fact_order_items i ON i.order_id = o.order_id
    WHERE NOT o.is_deleted
      AND o.order_purchase_ts >= TIMESTAMP '2018-01-01' AND o.order_purchase_ts < TIMESTAMP '2018-09-01'
    GROUP BY 1
    ORDER BY 1
  expected_failure: FANOUT_INFLATION

- id: FO12
  family: fanout
  difficulty: medium
  grain: order
  ordered: true
  question: "Which 5 sellers fulfilled the most distinct orders? Return the seller_id and order count, highest first, breaking ties by seller_id."
  gold_sql: |
    SELECT s.seller_id, count(DISTINCT i.order_id) AS orders
    FROM fact_order_items i
    JOIN fact_orders o ON o.order_id = i.order_id
    JOIN dim_seller s ON s.seller_key = i.seller_key
    WHERE NOT o.is_deleted
    GROUP BY 1
    ORDER BY orders DESC, s.seller_id
    LIMIT 5
  naive_sql: |
    SELECT s.seller_id, count(*) AS orders
    FROM fact_order_items i
    JOIN fact_orders o ON o.order_id = i.order_id
    JOIN dim_seller s ON s.seller_key = i.seller_key
    WHERE NOT o.is_deleted
    GROUP BY 1
    ORDER BY orders DESC, s.seller_id
    LIMIT 5
  expected_failure: FANOUT_INFLATION

