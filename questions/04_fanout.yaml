- id: FO08
  family: fanout
  difficulty: hard
  question: "What is the average total payment per order for each payment type? An order that used several payment types is included under each. Round to 2 decimals."
  gold_sql: |
    SELECT t.payment_type, round(avg(o.order_payment_total), 2) AS avg_payment
    FROM fact_orders o
    JOIN (SELECT DISTINCT order_id, payment_type FROM fact_payments) t ON t.order_id = o.order_id
    WHERE NOT o.is_deleted
    GROUP BY 1
  naive_sql: |
    SELECT p.payment_type, round(avg(o.order_payment_total), 2) AS avg_payment
    FROM fact_orders o
    JOIN fact_payments p ON p.order_id = o.order_id
    WHERE NOT o.is_deleted
    GROUP BY 1
  expected_failure: FANOUT_INFLATION

