# Trap: business-definition drift. Each metric has at least two plausible readings; the warehouse
# owner's canonical definition lives in semantic/semantic_layer.yaml. Trap queries are internally
# consistent SQL that implements a *different but reasonable* definition.
- id: DF01
  family: definition
  difficulty: medium
  metric: net_revenue
  question: "What was our total revenue in 2017?"
  gold_sql: |
    SELECT sum(i.price) AS revenue
    FROM fact_orders o
    JOIN fact_order_items i ON i.order_id = o.order_id
    WHERE NOT o.is_deleted AND lower(trim(o.order_status)) = 'delivered'
      AND o.order_purchase_ts >= TIMESTAMP '2017-01-01' AND o.order_purchase_ts < TIMESTAMP '2018-01-01'
  naive_sql: |
    SELECT sum(p.payment_value) AS revenue
    FROM fact_orders o
    JOIN fact_payments p ON p.order_id = o.order_id
    WHERE NOT o.is_deleted AND lower(trim(o.order_status)) = 'delivered'
      AND o.order_purchase_ts >= TIMESTAMP '2017-01-01' AND o.order_purchase_ts < TIMESTAMP '2018-01-01'
  expected_failure: DEFINITION_DRIFT

- id: DF02
  family: definition
  difficulty: medium
  metric: net_revenue
  ordered: true
  question: "Show monthly revenue from January to August 2018. Return the month number and revenue, ordered by month."
  gold_sql: |
    SELECT month(o.order_purchase_ts) AS month, sum(i.price) AS revenue
    FROM fact_orders o
    JOIN fact_order_items i ON i.order_id = o.order_id
    WHERE NOT o.is_deleted AND lower(trim(o.order_status)) = 'delivered'
      AND o.order_purchase_ts >= TIMESTAMP '2018-01-01' AND o.order_purchase_ts < TIMESTAMP '2018-09-01'
    GROUP BY 1
    ORDER BY 1
  naive_sql: |
    SELECT month(o.order_purchase_ts) AS month, sum(i.price + i.freight_value) AS revenue
    FROM fact_orders o
    JOIN fact_order_items i ON i.order_id = o.order_id
    WHERE NOT o.is_deleted AND lower(trim(o.order_status)) = 'delivered'
      AND o.order_purchase_ts >= TIMESTAMP '2018-01-01' AND o.order_purchase_ts < TIMESTAMP '2018-09-01'
    GROUP BY 1
    ORDER BY 1
  expected_failure: DEFINITION_DRIFT

- id: DF03
  family: definition
  difficulty: medium
  metric: net_revenue
  ordered: true
  question: "What are the top 5 product categories by revenue? Return the category and revenue, highest first, breaking ties alphabetically."
  gold_sql: |
    SELECT p.category_name AS category, sum(i.price) AS revenue
    FROM fact_orders o
    JOIN fact_order_items i ON i.order_id = o.order_id
    JOIN dim_product p ON p.product_key = i.product_key
    WHERE NOT o.is_deleted AND lower(trim(o.order_status)) = 'delivered' AND p.category_name IS NOT NULL
    GROUP BY 1
    ORDER BY revenue DESC, category
    LIMIT 5
  naive_sql: |
    SELECT p.category_name AS category, sum(i.price) AS revenue
    FROM fact_orders o
    JOIN fact_order_items i ON i.order_id = o.order_id
    JOIN dim_product p ON p.product_key = i.product_key
    WHERE NOT o.is_deleted AND p.category_name IS NOT NULL
    GROUP BY 1
    ORDER BY revenue DESC, category
    LIMIT 5
  expected_failure: DEFINITION_DRIFT

- id: DF04
  family: definition
  difficulty: medium
  metric: aov
  question: "What was the average order value in 2017? Round to 2 decimals."
  gold_sql: |
    SELECT round(sum(i.price) / count(DISTINCT o.order_id), 2) AS aov
    FROM fact_orders o
    JOIN fact_order_items i ON i.order_id = o.order_id
    WHERE NOT o.is_deleted AND lower(trim(o.order_status)) = 'delivered'
      AND o.order_purchase_ts >= TIMESTAMP '2017-01-01' AND o.order_purchase_ts < TIMESTAMP '2018-01-01'
  naive_sql: |
    SELECT round(avg(o.order_payment_total), 2) AS aov
    FROM fact_orders o
    WHERE NOT o.is_deleted AND lower(trim(o.order_status)) = 'delivered'
      AND o.order_purchase_ts >= TIMESTAMP '2017-01-01' AND o.order_purchase_ts < TIMESTAMP '2018-01-01'
  expected_failure: DEFINITION_DRIFT

- id: DF05
  family: definition
  difficulty: hard
  metric: active_customers
  question: "How many active customers do we currently have?"
  gold_sql: |
    SELECT count(DISTINCT c.customer_unique_id) AS active_customers
    FROM fact_orders o
    JOIN dim_customer c ON c.customer_key = o.customer_key
    WHERE NOT o.is_deleted AND NOT c.is_deleted
      AND lower(trim(o.order_status)) NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_ts >= TIMESTAMP '2018-06-03' AND o.order_purchase_ts < TIMESTAMP '2018-09-01'
  naive_sql: |
    SELECT count(DISTINCT c.customer_unique_id) AS active_customers
    FROM fact_orders o
    JOIN dim_customer c ON c.customer_key = o.customer_key
    WHERE NOT o.is_deleted AND NOT c.is_deleted
      AND lower(trim(o.order_status)) NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_ts >= CURRENT_DATE - INTERVAL 90 DAY
  expected_failure: DEFINITION_DRIFT

- id: DF06
