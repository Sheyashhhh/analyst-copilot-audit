  metric: active_customers
  ordered: true
  question: "Which 5 states have the most active customers? Return the state and active customer count, highest first, breaking ties alphabetically."
  gold_sql: |
    SELECT c.state, count(DISTINCT c.customer_unique_id) AS active_customers
    FROM fact_orders o
    JOIN dim_customer c ON c.customer_key = o.customer_key
    WHERE NOT o.is_deleted AND NOT c.is_deleted
      AND lower(trim(o.order_status)) NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_ts >= TIMESTAMP '2018-06-03' AND o.order_purchase_ts < TIMESTAMP '2018-09-01'
    GROUP BY c.state
    ORDER BY active_customers DESC, c.state
    LIMIT 5
  naive_sql: |
    SELECT c.state, count(DISTINCT c.customer_unique_id) AS active_customers
    FROM fact_orders o
    JOIN dim_customer c ON c.customer_key = o.customer_key
    WHERE NOT o.is_deleted AND NOT c.is_deleted
