- id: DF10
  family: definition
  difficulty: medium
  metric: freight_ratio
  question: "What share of our net revenue is freight? Express it as a percentage rounded to 2 decimals."
  gold_sql: |
    SELECT round(100.0 * sum(i.freight_value) / sum(i.price), 2) AS freight_pct
    FROM fact_orders o
    JOIN fact_order_items i ON i.order_id = o.order_id
    WHERE NOT o.is_deleted AND lower(trim(o.order_status)) = 'delivered'
  naive_sql: |
    SELECT round(100.0 * sum(i.freight_value) / sum(i.price + i.freight_value), 2) AS freight_pct
    FROM fact_orders o
    JOIN fact_order_items i ON i.order_id = o.order_id
    WHERE NOT o.is_deleted AND lower(trim(o.order_status)) = 'delivered'
  expected_failure: DEFINITION_DRIFT

