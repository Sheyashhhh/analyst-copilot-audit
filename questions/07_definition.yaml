- id: DF08
  family: definition
  difficulty: hard
  metric: late_delivery_rate
  question: "What percentage of delivered orders arrived late? Round to 2 decimals."
  gold_sql: |
    SELECT round(100.0 * count(*) FILTER (WHERE o.order_delivered_customer_ts::DATE > o.order_estimated_delivery_ts::DATE) / count(*), 2) AS late_pct
    FROM fact_orders o
    WHERE NOT o.is_deleted AND lower(trim(o.order_status)) = 'delivered'
      AND o.order_delivered_customer_ts IS NOT NULL
  naive_sql: |
    SELECT round(100.0 * count(*) FILTER (WHERE o.order_delivered_customer_ts > o.order_estimated_delivery_ts) / count(*), 2) AS late_pct
    FROM fact_orders o
    WHERE NOT o.is_deleted AND lower(trim(o.order_status)) = 'delivered'
      AND o.order_delivered_customer_ts IS NOT NULL
  expected_failure: DEFINITION_DRIFT

