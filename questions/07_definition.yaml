      AND o.order_purchase_ts >= TIMESTAMP '2018-08-02' AND o.order_purchase_ts < TIMESTAMP '2018-09-01'
    GROUP BY c.state
    ORDER BY active_customers DESC, c.state
    LIMIT 5
  expected_failure: DEFINITION_DRIFT

