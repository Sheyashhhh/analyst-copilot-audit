# Trap: order_purchase_ts and friends are TIMESTAMPs. A date-only upper bound
# ('2018-03-31') means midnight, silently dropping the whole last day.
- id: DB01
  family: date_boundary
  difficulty: medium
  grain: order
  question: "How many orders were placed in the first quarter of 2018 (1 January to 31 March, inclusive)?"
  gold_sql: |
    SELECT count(*) AS orders
    FROM fact_orders
    WHERE NOT is_deleted
      AND order_purchase_ts >= TIMESTAMP '2018-01-01' AND order_purchase_ts < TIMESTAMP '2018-04-01'
  naive_sql: |
    SELECT count(*) AS orders
    FROM fact_orders
    WHERE NOT is_deleted
      AND order_purchase_ts BETWEEN '2018-01-01' AND '2018-03-31'
  expected_failure: DATE_BOUNDARY_ERROR

