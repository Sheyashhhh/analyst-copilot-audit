- id: DB03
  family: date_boundary
  difficulty: medium
  metric: net_revenue
  question: "What was the net revenue for orders placed in the first half of 2018 (1 January to 30 June, inclusive)?"
  gold_sql: |
    SELECT sum(i.price) AS revenue
    FROM fact_orders o
    JOIN fact_order_items i ON i.order_id = o.order_id
    WHERE NOT o.is_deleted AND lower(trim(o.order_status)) = 'delivered'
      AND o.order_purchase_ts >= TIMESTAMP '2018-01-01' AND o.order_purchase_ts < TIMESTAMP '2018-07-01'
  naive_sql: |
    SELECT sum(i.price) AS revenue
    FROM fact_orders o
    JOIN fact_order_items i ON i.order_id = o.order_id
    WHERE NOT o.is_deleted AND lower(trim(o.order_status)) = 'delivered'
      AND o.order_purchase_ts >= '2018-01-01' AND o.order_purchase_ts <= '2018-06-30'
  expected_failure: DATE_BOUNDARY_ERROR

