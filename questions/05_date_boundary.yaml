- id: DB05
  family: date_boundary
  difficulty: medium
  grain: order
  ordered: true
  question: "How many orders were placed on each day from 7 May 2018 to 13 May 2018, inclusive? Return the date and the order count, ordered by date."
  gold_sql: |
    SELECT order_purchase_ts::DATE AS day, count(*) AS orders
    FROM fact_orders
    WHERE NOT is_deleted
      AND order_purchase_ts >= TIMESTAMP '2018-05-07' AND order_purchase_ts < TIMESTAMP '2018-05-14'
    GROUP BY 1
    ORDER BY 1
  naive_sql: |
    SELECT order_purchase_ts::DATE AS day, count(*) AS orders
    FROM fact_orders
    WHERE NOT is_deleted
      AND order_purchase_ts BETWEEN '2018-05-07' AND '2018-05-13'
    GROUP BY 1
    ORDER BY 1
  expected_failure: DATE_BOUNDARY_ERROR

